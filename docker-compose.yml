name: studio-os

services:
  postgres:
    image: postgres:17
    container_name: studio-os-postgres
    restart: unless-stopped
    environment:
      TZ: Africa/Cairo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: studio_os
    ports:
      # 5432 is taken by another local project (aiavatar-postgres)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d studio_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      TZ: Africa/Cairo
      GENERIC_TIMEZONE: Africa/Cairo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Scheduled workflows call the dashboard at this address ($env.DASHBOARD_URL).
      DASHBOARD_URL: ${DASHBOARD_URL:-http://host.docker.internal:3000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Local test inbox: every email n8n sends shows up at http://localhost:8025 until the real SMTP sender is set.
  mailpit:
    image: axllent/mailpit:latest
    container_name: studio-os-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: studio-os-backup
    restart: unless-stopped
    environment:
      TZ: Africa/Cairo
      POSTGRES_HOST: postgres
      POSTGRES_DB: studio_os,n8n
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
