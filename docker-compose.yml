name: studio-os

services:
  postgres:
    image: postgres:17
    container_name: studio-os-postgres
    restart: unless-stopped
    environment:
      TZ: Africa/Cairo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: studio_os
    ports:
      # 5432 is taken by another local project (aiavatar-postgres)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d studio_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Local only: the dashboard talks to n8n over the Docker network; open the editor through an SSH tunnel on the server.
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Africa/Cairo
      GENERIC_TIMEZONE: Africa/Cairo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Scheduled workflows call the dashboard at this address ($env.DASHBOARD_URL).
      DASHBOARD_URL: ${DASHBOARD_URL:-http://host.docker.internal:3000}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Lets the "Create project folders" workflow call fs.mkdirSync.
      NODE_FUNCTION_ALLOW_BUILTIN: fs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      # Office project files. Override PROJECTS_DIR in .env (e.g. D:/projects).
      - ${PROJECTS_DIR:-./projects}:/data/projects
    depends_on:
      postgres:
        condition: service_healthy

  # Local test inbox: every email n8n sends shows up at http://localhost:8025 until the real SMTP sender is set.
  mailpit:
    image: axllent/mailpit:latest
    container_name: studio-os-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Server only (`docker compose --profile app up -d`). Locally the dashboard runs with `npm run dev`.
  dashboard:
    build: ./dashboard
    container_name: studio-os-dashboard
    restart: unless-stopped
    profiles: [app]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/studio_os
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      APP_URL: ${APP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Studio OS <developers@artechsolutions.io>}
      AUTOMATION_SECRET: ${AUTOMATION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS in front of the dashboard. Set DOMAIN in .env; certificates are issued automatically.
  caddy:
    image: caddy:2-alpine
    container_name: studio-os-caddy
    restart: unless-stopped
    profiles: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - dashboard

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: studio-os-backup
    restart: unless-stopped
    environment:
      TZ: Africa/Cairo
      POSTGRES_HOST: postgres
      POSTGRES_DB: studio_os,n8n
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
